name: Listando Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependencies installieren
        run: npm install

      - name: Playwright Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: Agent ausfuehren
        run: node -e "require('./cloud-agent').runAgent().then(() => process.exit(0)).catch(e => { console.error(e.message); process.exit(1); })"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LISTANDO_EMAIL: ${{ secrets.LISTANDO_EMAIL }}
          LISTANDO_PASSWORD: ${{ secrets.LISTANDO_PASSWORD }}

      - name: State speichern
        if: always()
        run: |
          git config user.name "listando-bot"
          git config user.email "bot@time-picture.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "chore: state update $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
